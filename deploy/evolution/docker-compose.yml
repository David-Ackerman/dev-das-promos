# Evolution API server for automatic WhatsApp posts (WHATSAPP_MODE=evolution).
# Runs on a small always-on VM (guide: docs/WHATSAPP.md). setup.sh writes .env.
# 2.4.0-rc2 is the first image that can post to WhatsApp Channels (@newsletter).
services:
  evolution:
    image: evoapicloud/evolution-api:2.4.0-rc2
    restart: always
    depends_on: [postgres, redis]
    env_file: .env
    environment:
      SERVER_PORT: "8080"
      SERVER_URL: https://${DOMAIN}
      DEL_INSTANCE: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: das_promos
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # Needed so /chat/findChannels can find the channel id from its messages.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Free HTTPS certificate (Let's Encrypt) for ${DOMAIN}; the Worker only calls https.
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on: [evolution]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  caddy_data:
