# Cloudflare Worker: tracked redirects (/go), WhatsApp share links (/wa) and
# the Telegram bot webhook. Deployed by .github/workflows/deploy.yml.
# All settings are Worker secrets uploaded by that workflow -- nothing here.
name = "das-promos"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# 1st: starts the "Collect deals" workflow (needs GH_DISPATCH_TOKEN + GH_REPO).
#      UTC 9, 15, 21 = 6h, 12h, 18h in Brasília (COLLECT_HOURS in src/schedule.ts).
# 2nd: publishes queued posts when their time comes (QUEUE_CRON in src/http.ts).
# 3rd: Sundays 18h Brasília, sends the weekly Top 10 for approval (ROUNDUP_CRON).
[triggers]
# 4th: hourly at :37, only during a campaign (CAMPAIGN_TAG + CAMPAIGN_UNTIL): extra
#      search inside POSTING_HOURS, plus the "Top do dia" at 12h and 19h (CAMPAIGN_CRON).
crons = ["7 9,15,21 * * *", "*/5 * * * *", "0 21 * * SUN", "37 * * * *"]

# Banner and link-preview images for the public page (served as files, before the Worker).
[assets]
directory = "./public"

[observability]
enabled = true
