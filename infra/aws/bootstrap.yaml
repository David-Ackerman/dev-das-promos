AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap for das-promos on AWS. Creates the GitHub Actions
  GitHub Actions role that uses the account's existing GitHub OIDC provider
  (so workflows can authenticate to AWS with no stored keys),
  the role those workflows assume, and the IAM role/instance profile the
  EC2 instance uses to receive SSM Run Command deploys. Deploy this ONCE
  via the CloudFormation console (Create stack -> Upload a template file
  -> pick this file). Everything after this is managed by GitHub Actions
  via infra.yaml -- see docs/aws-deployment.md Part 2/3.5. Update this
  stack after changing the template so its backup bucket and EC2 role
  policy stay in sync.

Parameters:
  GitHubRepo:
    Type: String
    Description: "GitHub \"owner/repo\", e.g. David-Ackerman/dev-das-promos. Used for repositories with the legacy OIDC subject."
    AllowedPattern: "^[^/]+/[^/]+$"
  GitHubRepositoryOwnerId:
    Type: String
    Description: Stable numeric GitHub owner ID used to validate OIDC tokens.
    AllowedPattern: "^[0-9]+$"
  GitHubRepositoryId:
    Type: String
    Description: Stable numeric GitHub repository ID used to validate OIDC tokens.
    AllowedPattern: "^[0-9]+$"

Resources:
  PostgresBackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "das-promos-backups-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCurrentBackups
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  PostgresBackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PostgresBackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt PostgresBackupBucket.Arn
              - !Sub "${PostgresBackupBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  Ec2SsmRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dev-das-promos-ec2-ssm-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: postgres-backup-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBackupBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt PostgresBackupBucket.Arn
                Condition:
                  StringLike:
                    "s3:prefix":
                      - postgres
                      - postgres/*
              - Sid: ReadAndWritePostgresBackups
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${PostgresBackupBucket.Arn}/postgres/*"

  Ec2SsmInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: dev-das-promos-ec2-ssm-profile
      Roles:
        - !Ref Ec2SsmRole

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dev-das-promos-github-actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:repository_id": !Ref GitHubRepositoryId
                "token.actions.githubusercontent.com:repository_owner_id": !Ref GitHubRepositoryOwnerId
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
                  - !Sub "repo:*@${GitHubRepositoryOwnerId}/*@${GitHubRepositoryId}:ref:refs/heads/main"
      Policies:
        - PolicyName: manage-infra-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationManageInfraStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dev-das-promos-infra/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*"
              - Sid: CloudFormationManageInfraChangeSets
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dev-das-promos-infra/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*"
              - Sid: Ec2LaunchProjectInstance
                Effect: Allow
                Action: ec2:RunInstances
                Resource: "*"
              - Sid: CreateTaggedProjectSecurityGroup
                Effect: Allow
                Action: ec2:CreateSecurityGroup
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Name": dev-das-promos
                  "ForAllValues:StringEquals":
                    "aws:TagKeys":
                      - Name
              - Sid: AllocateTaggedProjectElasticIp
                Effect: Allow
                Action: ec2:AllocateAddress
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:RequestTag/Name": dev-das-promos-api
                  "ForAllValues:StringEquals":
                    "aws:TagKeys":
                      - Name
              - Sid: TagOnlyProjectResourcesDuringCreation
                Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    "ec2:CreateAction":
                      - RunInstances
                      - CreateSecurityGroup
                      - AllocateAddress
                    "aws:RequestTag/Name":
                      - dev-das-promos
                      - dev-das-promos-api
                  "ForAllValues:StringEquals":
                    "aws:TagKeys":
                      - Name
              - Sid: DenyUntaggedOrUnexpectedInstanceLaunches
                Effect: Deny
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  "Null":
                    "aws:RequestTag/Name": "true"
              - Sid: DenyNonProjectInstanceLaunches
                Effect: Deny
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringNotEquals:
                    "aws:RequestTag/Name": dev-das-promos
              - Sid: DenyOversizedInstanceLaunches
                Effect: Deny
                Action: ec2:RunInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringNotEquals:
                    "ec2:InstanceType": t3.small
              - Sid: TerminateOnlyProjectInstances
                Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ec2:ResourceTag/Name": dev-das-promos
              - Sid: UpdateOnlyProjectInstanceAttributes
                Effect: Allow
                Action:
                  - ec2:ModifyInstanceAttribute
                  - ec2:StartInstances
                  - ec2:StopInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ec2:ResourceTag/Name": dev-das-promos
              - Sid: ChangeOnlyProjectSecurityGroupRules
                Effect: Allow
                Action:
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                Condition:
                  StringEquals:
                    "ec2:ResourceTag/Name": dev-das-promos
              - Sid: ManageOnlyProjectElasticIp
                Effect: Allow
                Action:
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                  - ec2:ReleaseAddress
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*"
                Condition:
                  StringEquals:
                    "ec2:ResourceTag/Name": dev-das-promos-api
              - Sid: AssociateOrDisassociateOnlyOnProjectInstance
                Effect: Allow
                Action:
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ec2:ResourceTag/Name": dev-das-promos
              - Sid: Ec2ReadOnly
                Effect: Allow
                Action:
                  - ec2:Describe*
                Resource: "*"
              - Sid: PassOnlyTheSsmInstanceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt Ec2SsmRole.Arn
                Condition:
                  StringEquals:
                    "iam:PassedToService": ec2.amazonaws.com
              - Sid: DeployAppViaSsm
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
              - Sid: SendRunShellScriptToProjectInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: SendCommandOnlyToProjectInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ssm:resourceTag/Name": dev-das-promos

Outputs:
  GitHubActionsRoleArn:
    Description: Set this as the AWS_ROLE_ARN repo variable in GitHub (Settings -> Secrets and variables -> Actions -> Variables)
    Value: !GetAtt GitHubActionsRole.Arn
  Ec2SsmInstanceProfileName:
    Description: Used as the InstanceProfileName parameter when deploying infra.yaml
    Value: !Ref Ec2SsmInstanceProfile
  PostgresBackupBucketName:
    Description: Private, versioned S3 bucket for automated PostgreSQL backups
    Value: !Ref PostgresBackupBucket
  PostgresBackupBucketRegion:
    Description: AWS region for the PostgreSQL backup bucket
    Value: !Ref AWS::Region
