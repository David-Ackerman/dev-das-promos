name: das-promos

# Only stateful infrastructure runs in Docker. The Node apps (apps/api,
# apps/admin, apps/web) run directly on the host with `pnpm dev` / `pnpm
# start` -- this keeps local dev fast (no image rebuilds on every save) and
# matches how the apps would actually be deployed (each behind its own
# process manager / platform, not as a single docker-compose stack).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: das_promos
    ports:
      - "5432:5432"
    volumes:
      - das-promos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d das_promos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  das-promos-postgres:
