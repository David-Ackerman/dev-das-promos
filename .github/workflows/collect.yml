name: Collect deals

# Finds deals and sends previews to your Telegram bot for approval.
# Started on time by the Cloudflare Worker's cron (see wrangler.toml) and by
# the bot's /buscar command. There's no GitHub `schedule:` here on purpose:
# GitHub ran it hours late or skipped it. Both need GH_DISPATCH_TOKEN + GH_REPO.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --omit=dev
      - name: Load settings from repository variables and secrets
        run: node src/jobs/gh-export-env.ts
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
      - run: npm run collect
