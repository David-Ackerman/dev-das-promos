name: Collect deals

# Finds deals and sends previews to your Telegram bot for approval.
# Times are UTC: 12,15,18,21,00 UTC = 9h, 12h, 15h, 18h, 21h in Brasília.
# GitHub may start scheduled runs a few minutes late; that's normal.
# The bot's /buscar command also triggers this workflow.
on:
  schedule:
    - cron: "7 0,12,15,18,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --omit=dev
      - name: Load settings from repository variables and secrets
        run: node src/jobs/gh-export-env.ts
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
      - run: npm run collect
