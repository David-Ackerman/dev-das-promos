name: Manage AWS infrastructure

# Reusable infrastructure deployment for deploy.yml. Keeping this as a
# called workflow ensures CloudFormation finishes before the SSM app deploy,
# including commits that change both application and infrastructure. Run
# deploy.yml manually to apply infrastructure on demand.
on:
  workflow_call: {}

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_AMI_ID: ${{ vars.EC2_AMI_ID }}
          EC2_KEY_PAIR_NAME: ${{ vars.EC2_KEY_PAIR_NAME }}
          SSH_ALLOWED_CIDR: ${{ vars.SSH_ALLOWED_CIDR }}
          EC2_SSM_INSTANCE_PROFILE_NAME: ${{ vars.EC2_SSM_INSTANCE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          for name in AWS_ROLE_ARN AWS_REGION EC2_AMI_ID EC2_KEY_PAIR_NAME SSH_ALLOWED_CIDR EC2_SSM_INSTANCE_PROFILE_NAME; do
            if [ -z "${!name}" ]; then
              echo "Set the $name repository variable before deploying infrastructure." >&2
              exit 1
            fi
          done
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "AWS_ROLE_ARN must be an IAM role ARN in the AWS partition." >&2
            exit 1
          fi
          if [[ ! "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]; then
            echo "AWS_REGION must be a valid AWS region name." >&2
            exit 1
          fi
          if [[ ! "$EC2_AMI_ID" =~ ^ami-[0-9a-f]+$ ]]; then
            echo "EC2_AMI_ID must be an AMI ID such as ami-0123456789abcdef0." >&2
            exit 1
          fi
          if ! python3 - "$SSH_ALLOWED_CIDR" <<'PY'
          import ipaddress
          import sys

          try:
              network = ipaddress.ip_network(sys.argv[1], strict=True)
          except ValueError:
              raise SystemExit(1)

          if network.version != 4 or network.prefixlen != 32 or not network.network_address.is_global:
              raise SystemExit(1)
          PY
          then
            echo "SSH_ALLOWED_CIDR must be one public IPv4 address with a /32 mask." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check AMI availability and architecture
        env:
          EC2_AMI_ID: ${{ vars.EC2_AMI_ID }}
        run: |
          set -euo pipefail
          AMI_DETAILS=$(aws ec2 describe-images \
            --image-ids "$EC2_AMI_ID" \
            --query 'Images[0].[Architecture,State]' \
            --output text)
          if [ "$AMI_DETAILS" != $'x86_64\tavailable' ]; then
            echo "EC2_AMI_ID must identify an available x86_64 AMI for the t3.small instance; AWS returned: ${AMI_DETAILS:-no image}" >&2
            exit 1
          fi

      - name: Deploy infra stack
        env:
          EC2_AMI_ID: ${{ vars.EC2_AMI_ID }}
          EC2_KEY_PAIR_NAME: ${{ vars.EC2_KEY_PAIR_NAME }}
          SSH_ALLOWED_CIDR: ${{ vars.SSH_ALLOWED_CIDR }}
          EC2_SSM_INSTANCE_PROFILE_NAME: ${{ vars.EC2_SSM_INSTANCE_PROFILE_NAME }}
        run: |
          aws cloudformation deploy \
            --stack-name dev-das-promos-infra \
            --template-file infra/aws/infra.yaml \
            --parameter-overrides \
              "KeyPairName=$EC2_KEY_PAIR_NAME" \
              "SshAllowedCidr=$SSH_ALLOWED_CIDR" \
              "InstanceProfileName=$EC2_SSM_INSTANCE_PROFILE_NAME" \
              "AmiId=$EC2_AMI_ID" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Report deployed instance
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name dev-das-promos-infra \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          PUBLIC_IP=$(aws cloudformation describe-stacks \
            --stack-name dev-das-promos-infra \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIp'].OutputValue" \
            --output text)
          echo "Instance: $INSTANCE_ID ($PUBLIC_IP)"
          echo "### Deployed instance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance ID: \`$INSTANCE_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public IP: \`$PUBLIC_IP\`" >> "$GITHUB_STEP_SUMMARY"
