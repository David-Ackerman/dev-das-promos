name: Deploy

# Push to main = tests, then database migrations (additive only, data is
# never dropped), then the Cloudflare Worker, then the Telegram webhook.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund

      - name: Load settings from repository variables and the listed secrets
        run: node src/jobs/gh-export-env.ts
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_IDS: ${{ secrets.TELEGRAM_GROUP_IDS }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
          ZAPI_TOKEN: ${{ secrets.ZAPI_TOKEN }}

      - name: Back up the database before migrating
        run: |
          docker run --rm -e PGURL="$DATABASE_URL" postgres:18-alpine \
            sh -c 'pg_dump "$PGURL" --format=custom --no-owner --no-acl' > pre-deploy.dump
          ls -lh pre-deploy.dump
      - uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.sha }}
          path: pre-deploy.dump
          retention-days: 30

      - name: Migrate database
        run: npm run migrate

      - name: Deploy Cloudflare Worker
        id: worker
        run: |
          # pipefail: without it `| tee` hides wrangler's errors (a rejected cron
          # once left the queue schedule uninstalled while the deploy looked green).
          set -o pipefail
          npx wrangler deploy | tee wrangler.log
          if grep -q "ERROR" wrangler.log; then echo "::error::wrangler reported an error, see above"; exit 1; fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler.log | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$PUBLIC_BASE_URL" ] && [ -n "$URL" ]; then
            echo "PUBLIC_BASE_URL=$URL" >> "$GITHUB_ENV"
            echo "::warning::Add a repository variable PUBLIC_BASE_URL=$URL (Settings > Secrets and variables > Actions > Variables) so the scheduled job uses it too."
          fi

      - name: Upload Worker settings
        run: |
          node src/jobs/worker-secrets.ts "$RUNNER_TEMP/worker-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Point the Telegram bot at the Worker
        run: npm run set-webhook

      - name: Smoke test
        run: curl -fsS "$PUBLIC_BASE_URL/health"
