name: Deploy to AWS EC2

# Runs on every push to main: SSHes into the EC2 instance, pulls the new
# code, and rebuilds the api container in place. Mirrors the manual
# commands in docs/aws-deployment.md Part 3 -- nothing here builds an
# image in CI or pushes to a registry, matching the "build on the VM
# itself" approach the rest of the deployment docs already use.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            cd ~/dev-das-promos
            git pull --ff-only origin main
            docker compose -f infra/docker/docker-compose.prod.yml up -d --build
            docker compose -f infra/docker/docker-compose.prod.yml exec -T api \
              sh -c "cd /app/packages/database && pnpm exec tsx src/migrate.ts"
          '
