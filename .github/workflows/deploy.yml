name: Deploy to AWS EC2

# Runs on every push to main: authenticates to AWS via OIDC (no stored
# AWS keys, no SSH keys anywhere) using the official
# aws-actions/configure-aws-credentials action, then tells AWS Systems
# Manager to run the same git-pull + docker-compose-rebuild + migrate
# commands from docs/aws-deployment.md Part 3 directly on the EC2
# instance. Nothing here builds an image in CI or pushes to a registry --
# it still builds on the VM itself, matching the rest of the deployment
# docs. Depends on infra/aws/bootstrap.yaml (one-time, console) and
# infra/aws/infra.yaml (auto-applied by infra.yml) already having run --
# see docs/aws-deployment.md Part 2/3.5.
#
# paths-ignore on infra/aws/infra.yaml: that file's own changes are
# handled by infra.yml, which then updates EC2_INSTANCE_ID -- letting
# this workflow also fire on that same push risks reading the
# not-yet-updated variable in a race with that update.
on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/aws/infra.yaml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -- do not add AWS access keys as secrets instead
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy dev-das-promos (${{ github.sha }})" \
            --parameters commands='[
              "set -e",
              "cd ~/dev-das-promos",
              "git pull --ff-only origin main",
              "docker compose -f infra/docker/docker-compose.prod.yml up -d --build",
              "docker compose -f infra/docker/docker-compose.prod.yml exec -T api sh -c \"cd /app/packages/database && pnpm exec tsx src/migrate.ts\""
            ]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          [ "$STATUS" = "Success" ]
