name: Product links

# Started by the Worker when the admin sends more than 3 product links in one
# message (e.g. a batch of Mercado Livre affiliate links): each link becomes a
# preview, like a link sent alone. GitHub has no 30-second limit.
on:
  workflow_dispatch:
    inputs:
      text:
        description: "The admin's message (one link per line, optional prices after each)"
        required: true
      chat_id:
        description: "Admin chat id"
        required: true
      message_id:
        description: "The message with the links"
        required: true

permissions:
  contents: read

concurrency:
  group: links-${{ inputs.message_id }}
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --omit=dev
      - name: Load settings from repository variables and the listed secrets
        run: node src/jobs/gh-export-env.ts
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_IDS: ${{ secrets.TELEGRAM_GROUP_IDS }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
          ZAPI_TOKEN: ${{ secrets.ZAPI_TOKEN }}
      # The message goes through env, never inline in the script: no shell injection from its text.
      - run: node src/jobs/links.ts
        env:
          LINKS_TEXT: ${{ inputs.text }}
          LINKS_CHAT_ID: ${{ inputs.chat_id }}
          LINKS_MESSAGE_ID: ${{ inputs.message_id }}
