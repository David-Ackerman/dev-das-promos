name: Check production availability

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    if: vars.API_HEALTHCHECK_URL != '' && vars.PUBLIC_HEALTHCHECK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check API readiness
        env:
          CHECK_URL: ${{ vars.API_HEALTHCHECK_URL }}
        run: curl --fail --silent --show-error --max-time 20 "$CHECK_URL"

      - name: Check public website
        env:
          CHECK_URL: ${{ vars.PUBLIC_HEALTHCHECK_URL }}
        run: curl --fail --silent --show-error --location --max-time 20 "$CHECK_URL" --output /dev/null
